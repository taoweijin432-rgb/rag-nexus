[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-milvus-ingestion"
version = "0.1.0"
description = "Extensible chunk embedding and Milvus ingestion module for RAG pipelines."
requires-python = ">=3.10"
dependencies = [
    "pymysql>=1.1,<2.0",
    "pydantic>=2.7,<3.0",
    "pymilvus>=2.4,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/expert_index", "src/rag_vector_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
